<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare Benchmark Results</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
            background-color: rgb(249, 250, 251);
            padding: 20px;
            color: rgb(15, 23, 41);
            min-height: 100vh;
            font-size: 14px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header {
            background: white;
            padding: 24px 30px;
            border-radius: 12px;
            margin-bottom: 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.07);
            border: 1px solid #e1e4e8;
        }
        h1 { color: rgb(15, 23, 41); margin-bottom: 4px; font-weight: 700; font-size: 22px; }
        .back-button {
            display: inline-block;
            padding: 8px 16px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 16px;
            font-weight: 600;
            font-size: 13px;
        }
        .back-button:hover { background: #5568d3; }
        .card {
            background: white;
            padding: 20px 24px;
            border-radius: 12px;
            margin-bottom: 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.07);
            border: 1px solid #e1e4e8;
        }
        .card h2 { font-size: 16px; margin-bottom: 14px; color: #1f2328; }
        .selector-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 4px;
        }
        .selector-box {
            padding: 14px 16px;
            background: #f6f8fa;
            border-radius: 8px;
            border: 2px solid #e1e4e8;
        }
        .selector-box.baseline { border-color: #3b82f6; }
        .selector-box.contender { border-color: #7c5cd8; }
        .selector-box h3 { margin-bottom: 10px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
        .selector-box.baseline h3 { color: #3b82f6; }
        .selector-box.contender h3 { color: #7c5cd8; }
        select, button {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 13px;
            background: white;
            margin-top: 8px;
            color: #1f2328;
        }
        select:first-of-type { margin-top: 0; }
        .compare-btn {
            background: #3b82f6;
            color: white;
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            margin-top: 16px;
            width: auto;
            display: block;
        }
        .compare-btn:hover { background: #2563eb; }
        .compare-btn:disabled { background: #ccc; cursor: not-allowed; }
        .info-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .pill {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            background: #e8f0fe;
            color: #3b5bdb;
            font-weight: 500;
        }
        .loading { text-align: center; padding: 40px; font-size: 16px; color: #666; }
        .error { color: #d32f2f; padding: 16px; background: #ffebee; border-radius: 8px; margin: 12px 0; font-size: 13px; }
        .no-data { color: #666; font-style: italic; font-size: 13px; padding: 8px 0; }

        /* ── OSB-style diff table ── */
        .diff-table-wrap { overflow-x: auto; }
        table.diff-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            font-variant-numeric: tabular-nums;
        }
        table.diff-table th {
            background: #f6f8fa;
            border-bottom: 2px solid #d1d5db;
            padding: 9px 14px;
            text-align: right;
            font-weight: 700;
            color: #57606a;
            font-size: 12px;
            white-space: nowrap;
        }
        table.diff-table th:first-child { text-align: left; }
        table.diff-table td {
            padding: 7px 14px;
            border-bottom: 1px solid #f0f2f4;
            text-align: right;
            color: #1f2328;
        }
        table.diff-table td:first-child { text-align: left; color: #57606a; }
        table.diff-table tbody tr:hover td { background: #f9fafb; }
        table.diff-table tbody tr.section-header td {
            background: #f0f4ff;
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #3b5bdb;
            padding: 5px 14px;
        }
        .diff-pos { color: #cf222e; }   /* worse for most metrics */
        .diff-neg { color: #1a7f37; }   /* better  */
        .diff-pos.invert { color: #1a7f37; }  /* throughput / recall: higher is better */
        .diff-neg.invert { color: #cf222e; }
        .diff-zero { color: #57606a; }
        .badge-baseline { display: inline-block; padding: 1px 7px; border-radius: 8px; background: #dbeafe; color: #1d4ed8; font-size: 11px; font-weight: 600; }
        .badge-contender { display: inline-block; padding: 1px 7px; border-radius: 8px; background: #ede9fe; color: #6d28d9; font-size: 11px; font-weight: 600; }
        .share-btn {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 5px 13px; border-radius: 6px;
            background: #f6f8fa; border: 1px solid #d1d5db;
            color: #57606a; font-size: 12px; font-weight: 600;
            cursor: pointer; text-decoration: none;
            transition: background 0.15s;
        }
        .share-btn:hover { background: #e9ecef; color: #1f2328; }
        .share-btn.copied { background: #dcfce7; border-color: #86efac; color: #166534; }
        .diff-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
        .diff-heading h2 { margin-bottom: 0; }
        .toast {
            position: fixed; bottom: 24px; right: 24px;
            background: #1f2328; color: white;
            padding: 10px 18px; border-radius: 8px;
            font-size: 13px; font-weight: 500;
            opacity: 0; transition: opacity 0.2s;
            pointer-events: none; z-index: 9999;
        }
        .toast.show { opacity: 1; }

        /* Charts */
        .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 4px; }
        .chart-box { padding: 16px; background: #fafbfc; border-radius: 10px; border: 1px solid #e1e4e8; }
        .chart-box h3 { font-size: 13px; font-weight: 700; color: #57606a; margin-bottom: 12px; }
        .bar-chart { display: flex; flex-direction: column; gap: 8px; }
        .bar-row { display: grid; grid-template-columns: 130px 1fr 70px; align-items: center; gap: 8px; font-size: 12px; }
        .bar-label { text-align: right; color: #57606a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .bar-track { height: 12px; background: #e5e7eb; border-radius: 6px; position: relative; overflow: hidden; }
        .bar-fill { height: 100%; border-radius: 6px; transition: width 0.3s ease; }
        .bar-value { color: #1f2328; font-weight: 500; text-align: left; }

        @media (max-width: 800px) {
            .selector-grid { grid-template-columns: 1fr; }
            .chart-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Compare Benchmark Results</h1>
            <p style="color:#57606a;font-size:13px;margin-top:4px;">Side-by-side diff table in opensearch-benchmark style</p>
        </div>

        <a href="/" class="back-button">← Back to Dashboard</a>

        <div class="card">
            <h2>Select Jobs &amp; Sweeps</h2>
            <div class="selector-grid">
                <div class="selector-box baseline">
                    <h3>Baseline</h3>
                    <select id="jobA" onchange="onJobChange('A')">
                        <option value="">Loading jobs…</option>
                    </select>
                    <select id="sweepA" onchange="updateCompareButton()" style="display:none">
                        <option value="">Select sweep…</option>
                    </select>
                    <div id="infoA" class="info-pills"></div>
                </div>
                <div class="selector-box contender">
                    <h3>Contender</h3>
                    <select id="jobB" onchange="onJobChange('B')">
                        <option value="">Loading jobs…</option>
                    </select>
                    <select id="sweepB" onchange="updateCompareButton()" style="display:none">
                        <option value="">Select sweep…</option>
                    </select>
                    <div id="infoB" class="info-pills"></div>
                </div>
            </div>
            <button class="compare-btn" onclick="runComparison()" id="compareBtn" disabled>Compare</button>
        </div>

        <div id="loading" class="loading" style="display:none">Loading…</div>
        <div id="error" class="error" style="display:none"></div>

        <div id="results" style="display:none">
            <div class="card">
                <div class="diff-heading">
                    <h2>Metrics Diff</h2>
                    <button class="share-btn" id="shareBtn" onclick="copyShareLink()">
                        🔗 Copy share link
                    </button>
                </div>
                <div class="diff-table-wrap" id="diffTable"></div>
            </div>
            <div class="card" id="chartsCard">
                <h2>Visual Comparison</h2>
                <div class="chart-grid" id="chartGrid"></div>
            </div>
        </div>
    </div>
    <div class="toast" id="toast"></div>

<script>
// ─────────────────────────────────────────────
// State
// ─────────────────────────────────────────────
let allJobs = [];
const sweepCache = {};  // jobId → [{label, sweep_name, test_run, workload_params}]

// ─────────────────────────────────────────────
// Init
// ─────────────────────────────────────────────
async function init() {
    try {
        const resp = await fetch('/api/v1/benchmark');
        const data = await resp.json();
        const RESULTS_STATUSES = ['completed', 'partial', 'error', 'cancelled', 'failed'];
        allJobs = (data.jobs || []).filter(j => RESULTS_STATUSES.includes(j.status));
        const opts = '<option value="">Select job…</option>' +
            allJobs.map(j => {
                const statusTag = j.status !== 'completed' ? ` [${j.status}]` : '';
                const label = [j.job_id.substring(0, 10), j.dataset, j.engine, j.scenario || j.ui_scenario]
                    .filter(Boolean).join(' · ') + statusTag;
                return `<option value="${j.job_id}">${label}</option>`;
            }).join('');
        document.getElementById('jobA').innerHTML = opts;
        document.getElementById('jobB').innerHTML = opts;
    } catch (e) {
        showError('Failed to load jobs: ' + e.message);
        return;
    }

    // Restore state from URL params and auto-run if complete
    const p = new URLSearchParams(location.search);
    const pJobA = p.get('a'), pJobB = p.get('b');
    const pSweepA = p.get('sa'), pSweepB = p.get('sb');
    if (pJobA && pJobB) {
        document.getElementById('jobA').value = pJobA;
        document.getElementById('jobB').value = pJobB;
        // Load sweeps for both jobs, then set sweep indices and run
        try {
            await Promise.all([onJobChange('A'), onJobChange('B')]);
            if (pSweepA !== null) document.getElementById('sweepA').value = pSweepA;
            if (pSweepB !== null) document.getElementById('sweepB').value = pSweepB;
            updateCompareButton();
            if (!document.getElementById('compareBtn').disabled) {
                await runComparison();
            }
        } catch (e) {
            // non-fatal — user can still select manually
        }
    }
}

// ─────────────────────────────────────────────
// Job change → populate sweep selector
// ─────────────────────────────────────────────
async function onJobChange(which) {
    const jobId = document.getElementById(`job${which}`).value;
    const sweepSel = document.getElementById(`sweep${which}`);
    const infoDiv = document.getElementById(`info${which}`);

    sweepSel.style.display = 'none';
    infoDiv.innerHTML = '';
    updateCompareButton();

    if (!jobId) return;

    const job = allJobs.find(j => j.job_id === jobId);
    if (job) {
        infoDiv.innerHTML = [
            job.dataset && `<span class="pill">${job.dataset}</span>`,
            job.engine && `<span class="pill">${job.engine}</span>`,
            (job.scenario || job.ui_scenario) && `<span class="pill">${job.scenario || job.ui_scenario}</span>`,
            job.completed_at && `<span class="pill">${new Date(job.completed_at).toLocaleDateString()}</span>`
        ].filter(Boolean).join('');
    }

    // Load sweeps
    try {
        const sweeps = await fetchSweeps(jobId);
        if (sweeps.length === 0) {
            infoDiv.innerHTML += '<div class="no-data">No sweep data available</div>';
            return;
        }
        sweepSel.innerHTML = sweeps.map((s, i) =>
            `<option value="${i}">${s.label}</option>`
        ).join('');
        sweepSel.style.display = 'block';
        updateCompareButton();
    } catch (e) {
        infoDiv.innerHTML += `<div class="error">${e.message}</div>`;
    }
}

async function fetchSweeps(jobId) {
    if (sweepCache[jobId]) return sweepCache[jobId];
    const resp = await fetch(`/api/v1/benchmark/${jobId}/results`);
    if (!resp.ok) throw new Error(`Failed to fetch results (${resp.status})`);
    const data = await resp.json();
    const sweeps = (data.sweeps || []).map(s => ({
        label: buildSweepLabel(s),
        sweep_name: s.sweep_name,
        scenario_label: s.scenario_label,
        dataset: s.dataset,
        test_run: s.test_run,
        workload_params: s.workload_params
    }));
    sweepCache[jobId] = sweeps;
    return sweeps;
}

function buildSweepLabel(s) {
    const parts = [];
    if (s.scenario_label) parts.push(s.scenario_label);
    if (s.sweep_name && s.sweep_name !== 'sweep-1') parts.push(s.sweep_name);
    // Include distinguishing workload params
    const wp = s.workload_params || {};
    if (wp.search_clients) parts.push(`clients=${wp.search_clients}`);
    if (wp.ef_search) parts.push(`ef=${wp.ef_search}`);
    if (wp.query_k) parts.push(`k=${wp.query_k}`);
    return parts.join(' · ') || s.sweep_name || 'sweep';
}

function updateCompareButton() {
    const jobA = document.getElementById('jobA').value;
    const jobB = document.getElementById('jobB').value;
    const sweepA = document.getElementById('sweepA');
    const sweepB = document.getElementById('sweepB');
    const btn = document.getElementById('compareBtn');

    const aReady = jobA && (sweepA.style.display === 'none' || sweepA.value !== '');
    const bReady = jobB && (sweepB.style.display === 'none' || sweepB.value !== '');
    btn.disabled = !(aReady && bReady);
}

// ─────────────────────────────────────────────
// Compare
// ─────────────────────────────────────────────
async function runComparison() {
    const jobAId = document.getElementById('jobA').value;
    const jobBId = document.getElementById('jobB').value;
    const sweepAIdx = parseInt(document.getElementById('sweepA').value || '0', 10);
    const sweepBIdx = parseInt(document.getElementById('sweepB').value || '0', 10);

    document.getElementById('loading').style.display = 'block';
    document.getElementById('error').style.display = 'none';
    document.getElementById('results').style.display = 'none';

    try {
        const [sweepsA, sweepsB] = await Promise.all([
            fetchSweeps(jobAId),
            fetchSweeps(jobBId)
        ]);
        const sweepA = sweepsA[sweepAIdx];
        const sweepB = sweepsB[sweepBIdx];

        if (!sweepA || !sweepB) {
            showError('Could not find the selected sweeps');
            return;
        }

        renderDiffTable(sweepA, sweepB);
        renderCharts(sweepA, sweepB);
        document.getElementById('results').style.display = 'block';

        // Update URL so it's shareable without triggering a page reload
        const params = new URLSearchParams({
            a: jobAId, sa: sweepAIdx,
            b: jobBId, sb: sweepBIdx
        });
        history.replaceState(null, '', `?${params}`);
    } catch (e) {
        showError(e.message);
    } finally {
        document.getElementById('loading').style.display = 'none';
    }
}

// ─────────────────────────────────────────────
// Share
// ─────────────────────────────────────────────
function copyShareLink() {
    const url = location.href;
    navigator.clipboard.writeText(url).then(() => {
        const btn = document.getElementById('shareBtn');
        btn.classList.add('copied');
        btn.textContent = '✓ Link copied!';
        showToast('Share link copied to clipboard');
        setTimeout(() => {
            btn.classList.remove('copied');
            btn.textContent = '🔗 Copy share link';
        }, 2500);
    }).catch(() => {
        // Fallback for non-HTTPS or denied clipboard
        prompt('Copy this link:', url);
    });
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
}

// ─────────────────────────────────────────────
// Metric extraction helpers
// ─────────────────────────────────────────────
function getNum(obj, ...keys) {
    for (const k of keys) {
        if (obj && obj[k] !== undefined && obj[k] !== null) return +obj[k];
    }
    return null;
}

function fmt(v, decimals = 5) {
    if (v === null || v === undefined) return '—';
    return Number(v).toFixed(decimals);
}

// Build a flat list of {metric, unit, higherIsBetter, baselineVal, contenderVal}
function extractRows(trA, trB) {
    const rows = [];
    const rA = trA?.results || {};
    const rB = trB?.results || {};

    function add(metric, unit, higher, vA, vB) {
        if (vA === null && vB === null) return;
        rows.push({ metric, unit, higherIsBetter: higher, vA, vB });
    }

    function section(name) {
        rows.push({ __section: name });
    }

    // ── Throughput ──
    const opsA = Array.isArray(rA.op_metrics) ? rA.op_metrics : [];
    const opsB = Array.isArray(rB.op_metrics) ? rB.op_metrics : [];
    const allTasks = [...new Set([...opsA.map(o => o.task), ...opsB.map(o => o.task)])];

    allTasks.forEach(task => {
        const oA = opsA.find(o => o.task === task) || {};
        const oB = opsB.find(o => o.task === task) || {};

        const tLabel = task.length > 40 ? task.slice(0, 38) + '…' : task;

        // Throughput
        const thA = oA.throughput, thB = oB.throughput;
        const unit = (thA || thB)?.unit || 'ops/s';
        if (thA || thB) {
            section(`Task: ${tLabel} — Throughput`);
            add('Min throughput', unit, true, getNum(thA, 'min'), getNum(thB, 'min'));
            add('Mean throughput', unit, true, getNum(thA, 'mean'), getNum(thB, 'mean'));
            add('Median throughput', unit, true, getNum(thA, 'median'), getNum(thB, 'median'));
            add('Max throughput', unit, true, getNum(thA, 'max'), getNum(thB, 'max'));
        }

        // Latency
        const lA = oA.latency, lB = oB.latency;
        const lUnit = (lA || lB)?.unit || 'ms';
        if (lA || lB) {
            section(`Task: ${tLabel} — Latency`);
            ['50_0', '90_0', '99_0', '99_9', '100_0'].forEach(p => {
                const vA = getNum(lA, p), vB = getNum(lB, p);
                if (vA !== null || vB !== null) {
                    add(`Latency ${p.replace('_', '.')}th pct`, lUnit, false, vA, vB);
                }
            });
            add('Mean latency', lUnit, false, getNum(lA, 'mean'), getNum(lB, 'mean'));
        }

        // Service time
        const sA = oA.service_time, sB = oB.service_time;
        if ((sA || sB) && (getNum(sA, '50_0') || getNum(sB, '50_0'))) {
            section(`Task: ${tLabel} — Service Time`);
            ['50_0', '90_0', '99_0', '100_0'].forEach(p => {
                const vA = getNum(sA, p), vB = getNum(sB, p);
                if (vA !== null || vB !== null) {
                    add(`Service time ${p.replace('_', '.')}th pct`, (sA||sB)?.unit || 'ms', false, vA, vB);
                }
            });
        }

        // Error rate
        const erA = oA.error_rate !== undefined ? +oA.error_rate : null;
        const erB = oB.error_rate !== undefined ? +oB.error_rate : null;
        if (erA !== null || erB !== null) {
            add('Error rate', '%', false, erA !== null ? erA * 100 : null, erB !== null ? erB * 100 : null);
        }
    });

    // ── Correctness ──
    const corrA = Array.isArray(rA.correctness_metrics) ? rA.correctness_metrics : [];
    const corrB = Array.isArray(rB.correctness_metrics) ? rB.correctness_metrics : [];
    const corrTasks = [...new Set([...corrA.map(c => c.task), ...corrB.map(c => c.task)])];
    corrTasks.forEach(task => {
        const cA = corrA.find(c => c.task === task) || {};
        const cB = corrB.find(c => c.task === task) || {};
        const tLabel = task.length > 40 ? task.slice(0, 38) + '…' : task;
        const rkA = cA['recall@k'], rkB = cB['recall@k'];
        const r1A = cA['recall@1'], r1B = cB['recall@1'];
        if (rkA || rkB || r1A || r1B) {
            section(`Task: ${tLabel} — Recall`);
            ['50_0', '90_0', '99_0', '100_0', 'mean'].forEach(p => {
                const vA = getNum(rkA, p), vB = getNum(rkB, p);
                if (vA !== null || vB !== null) {
                    add(`Recall@k ${p.replace('_', '.')}th pct`, '', true, vA, vB);
                }
            });
            ['50_0', '90_0', '99_0', '100_0', 'mean'].forEach(p => {
                const vA = getNum(r1A, p), vB = getNum(r1B, p);
                if (vA !== null || vB !== null) {
                    add(`Recall@1 ${p.replace('_', '.')}th pct`, '', true, vA, vB);
                }
            });
        }
    });

    // ── Cluster / Index metrics ──
    const scalarPairs = [
        ['total_time', 'Total indexing time', 'ms', false],
        ['merge_time', 'Total merge time', 'ms', false],
        ['refresh_time', 'Total refresh time', 'ms', false],
        ['flush_time', 'Total flush time', 'ms', false],
        ['merge_throttle_time', 'Total merge throttle time', 'ms', false],
        ['young_gc_time', 'Total Young Gen GC time', 'ms', false],
        ['young_gc_count', 'Total Young Gen GC count', '', false],
        ['old_gc_time', 'Total Old Gen GC time', 'ms', false],
        ['old_gc_count', 'Total Old Gen GC count', '', false],
        ['segment_count', 'Segment count', '', false],
        ['store_size', 'Index store size', 'bytes', false],
        ['docs_count', 'Docs count', '', true],
        ['memory_segments', 'Heap used for segments', 'bytes', false],
        ['memory_doc_values', 'Heap used for doc values', 'bytes', false],
        ['memory_terms', 'Heap used for terms', 'bytes', false],
        ['memory_norms', 'Heap used for norms', 'bytes', false],
        ['memory_points', 'Heap used for points', 'bytes', false],
        ['memory_stored_fields', 'Heap used for stored fields', 'bytes', false],
    ];
    const scalarVals = scalarPairs.map(([key, label, unit, higher]) => ({
        key, label, unit, higher,
        vA: rA[key] !== undefined && rA[key] !== null && rA[key] !== 0 ? +rA[key] : null,
        vB: rB[key] !== undefined && rB[key] !== null && rB[key] !== 0 ? +rB[key] : null
    })).filter(r => r.vA !== null || r.vB !== null);

    if (scalarVals.length) {
        section('Cluster & Index Metrics');
        scalarVals.forEach(r => {
            let vA = r.vA, vB = r.vB, unit = r.unit;
            // Convert bytes → GB
            if (r.unit === 'bytes') {
                vA = vA !== null ? vA / 1e9 : null;
                vB = vB !== null ? vB / 1e9 : null;
                unit = 'GB';
            }
            // Convert ms → min for time fields
            if (r.unit === 'ms' && r.key !== 'young_gc_time' && r.key !== 'old_gc_time') {
                vA = vA !== null ? vA / 60000 : null;
                vB = vB !== null ? vB / 60000 : null;
                unit = 'min';
            }
            add(r.label, unit, r.higher, vA, vB);
        });
    }

    return rows;
}

// ─────────────────────────────────────────────
// Render diff table
// ─────────────────────────────────────────────
function renderDiffTable(sweepA, sweepB) {
    const trA = sweepA.test_run;
    const trB = sweepB.test_run;
    const rows = extractRows(trA, trB);

    if (!rows.length || rows.every(r => r.__section)) {
        document.getElementById('diffTable').innerHTML =
            '<p class="no-data">No comparable metrics found in the selected sweeps.</p>';
        return;
    }

    const baseLabel = sweepA.label;
    const contLabel = sweepB.label;

    let html = `
    <table class="diff-table">
      <thead>
        <tr>
          <th>Metric</th>
          <th><span class="badge-baseline">Baseline</span></th>
          <th><span class="badge-contender">Contender</span></th>
          <th>Diff</th>
          <th>Diff %</th>
        </tr>
      </thead>
      <tbody>`;

    rows.forEach(row => {
        if (row.__section) {
            html += `<tr class="section-header"><td colspan="5">${row.__section}</td></tr>`;
            return;
        }
        const { metric, unit, higherIsBetter, vA, vB } = row;
        const unitStr = unit ? ` [${unit}]` : '';
        const cellA = vA !== null ? fmt(vA) : '—';
        const cellB = vB !== null ? fmt(vB) : '—';

        let diffStr = '—', diffPctStr = '—', diffClass = 'diff-zero';
        if (vA !== null && vB !== null) {
            const diff = vB - vA;
            const diffPct = vA !== 0 ? (diff / Math.abs(vA)) * 100 : null;
            const sign = diff > 0 ? '+' : '';
            diffStr = `${sign}${fmt(diff)}`;
            diffPctStr = diffPct !== null ? `${sign}${diffPct.toFixed(2)}%` : '—';

            if (Math.abs(diff) < 1e-9) {
                diffClass = 'diff-zero';
            } else if (diff > 0) {
                diffClass = higherIsBetter ? 'diff-pos invert' : 'diff-pos';
            } else {
                diffClass = higherIsBetter ? 'diff-neg invert' : 'diff-neg';
            }
        }

        html += `<tr>
          <td>${metric}${unitStr}</td>
          <td>${cellA}</td>
          <td>${cellB}</td>
          <td class="${diffClass}">${diffStr}</td>
          <td class="${diffClass}">${diffPctStr}</td>
        </tr>`;
    });

    html += '</tbody></table>';
    document.getElementById('diffTable').innerHTML = html;
}

// ─────────────────────────────────────────────
// Render bar charts
// ─────────────────────────────────────────────
function renderCharts(sweepA, sweepB) {
    const trA = sweepA.test_run;
    const trB = sweepB.test_run;
    const rA = trA?.results || {};
    const rB = trB?.results || {};

    const opsA = Array.isArray(rA.op_metrics) ? rA.op_metrics : [];
    const opsB = Array.isArray(rB.op_metrics) ? rB.op_metrics : [];
    const allTasks = [...new Set([...opsA.map(o => o.task), ...opsB.map(o => o.task)])];

    const corrA = Array.isArray(rA.correctness_metrics) ? rA.correctness_metrics : [];
    const corrB = Array.isArray(rB.correctness_metrics) ? rB.correctness_metrics : [];

    const charts = [];

    allTasks.forEach(task => {
        const oA = opsA.find(o => o.task === task) || {};
        const oB = opsB.find(o => o.task === task) || {};
        const tLabel = task.length > 30 ? task.slice(0, 28) + '…' : task;

        // Latency percentiles
        const lA = oA.latency, lB = oB.latency;
        if (lA || lB) {
            const lUnit = (lA || lB)?.unit || 'ms';
            const pcts = ['50_0', '90_0', '99_0', '100_0'];
            const items = pcts.map(p => ({
                label: `p${p.replace('_', '.')}`,
                a: getNum(lA, p),
                b: getNum(lB, p)
            })).filter(it => it.a !== null || it.b !== null);
            if (items.length) charts.push({ title: `Latency — ${tLabel} [${lUnit}]`, items, higherIsBetter: false });
        }

        // Throughput
        const thA = oA.throughput, thB = oB.throughput;
        if (thA || thB) {
            const tUnit = (thA || thB)?.unit || 'ops/s';
            charts.push({
                title: `Throughput — ${tLabel} [${tUnit}]`,
                items: [
                    { label: 'Min', a: getNum(thA, 'min'), b: getNum(thB, 'min') },
                    { label: 'Median', a: getNum(thA, 'median'), b: getNum(thB, 'median') },
                    { label: 'Max', a: getNum(thA, 'max'), b: getNum(thB, 'max') },
                ].filter(it => it.a !== null || it.b !== null),
                higherIsBetter: true
            });
        }

        // Recall
        const cA = corrA.find(c => c.task === task) || {};
        const cB = corrB.find(c => c.task === task) || {};
        const rkA = cA['recall@k'], rkB = cB['recall@k'];
        if (rkA || rkB) {
            const pcts = ['50_0', '90_0', '100_0', 'mean'];
            const items = pcts.map(p => ({
                label: p === 'mean' ? 'Mean' : `p${p.replace('_', '.')}`,
                a: getNum(rkA, p),
                b: getNum(rkB, p)
            })).filter(it => it.a !== null || it.b !== null);
            if (items.length) charts.push({ title: `Recall@k — ${tLabel}`, items, higherIsBetter: true });
        }
    });

    if (!charts.length) {
        document.getElementById('chartsCard').style.display = 'none';
        return;
    }
    document.getElementById('chartsCard').style.display = 'block';

    const grid = document.getElementById('chartGrid');
    grid.innerHTML = charts.map(ch => renderBarChart(ch, sweepA.label, sweepB.label)).join('');
}

function renderBarChart({ title, items, higherIsBetter }, labelA, labelB) {
    const allVals = items.flatMap(it => [it.a, it.b]).filter(v => v !== null && v > 0);
    const maxVal = allVals.length ? Math.max(...allVals) : 1;

    const rows = items.map(it => {
        const pctA = it.a !== null ? (it.a / maxVal) * 100 : 0;
        const pctB = it.b !== null ? (it.b / maxVal) * 100 : 0;
        const diff = it.a !== null && it.b !== null ? it.b - it.a : null;
        let barColor = '#3b82f6';
        if (diff !== null && Math.abs(diff) > 1e-9) {
            const better = (diff > 0) === higherIsBetter;
            barColor = better ? '#1a7f37' : '#cf222e';
        }
        const fmtVal = v => v !== null ? (Math.abs(v) >= 1000 ? v.toFixed(0) : v.toFixed(3)) : '—';
        return `
        <div style="margin-bottom:10px">
          <div style="font-size:11px;font-weight:600;color:#57606a;margin-bottom:4px">${it.label}</div>
          <div class="bar-row">
            <div class="bar-label" style="font-size:11px;color:#3b82f6">Baseline</div>
            <div class="bar-track"><div class="bar-fill" style="width:${pctA.toFixed(1)}%;background:#3b82f6"></div></div>
            <div class="bar-value" style="font-size:11px">${fmtVal(it.a)}</div>
          </div>
          <div class="bar-row">
            <div class="bar-label" style="font-size:11px;color:#7c5cd8">Contender</div>
            <div class="bar-track"><div class="bar-fill" style="width:${pctB.toFixed(1)}%;background:${barColor}"></div></div>
            <div class="bar-value" style="font-size:11px">${fmtVal(it.b)}</div>
          </div>
        </div>`;
    }).join('');

    return `<div class="chart-box">
      <h3>${title}</h3>
      ${rows}
    </div>`;
}

// ─────────────────────────────────────────────
// Utilities
// ─────────────────────────────────────────────
function showError(msg) {
    const el = document.getElementById('error');
    el.textContent = msg;
    el.style.display = 'block';
    document.getElementById('loading').style.display = 'none';
}

init();
</script>
