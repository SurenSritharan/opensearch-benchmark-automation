# Dataset Configuration Registry

datasets:
  cohere-wiki-en-768:
    dimension: 768
    format: hdf5
    space_type: "innerproduct"
    description: "Cohere embeddings dataset with 768-dimensional vectors - configurable corpus size"
    workload: "vectorsearch" # needs to match opensearch-benchmark-workloads folder

    supported_corpus_sizes: ["1m", "5m", "10m"]

    # Files that must be pre-seeded onto worker PVCs before benchmarking.
    # These are HDF5 corpus files not publicly available on CloudFront that are
    # stored in GCS and downloaded by the Jenkins "Seed Dataset Cache" stage.
    # Add an entry here whenever a new corpus file is stored in GCS.
    #
    # Fields:
    #   corpus_size  - matches a value in supported_corpus_sizes (used to scope
    #                  the seed step to only the corpus sizes being benchmarked)
    #   gcs_path     - full gs:// object path
    #   target_path  - absolute path on the worker pod where OSB expects the file
    #                  (under BENCHMARK_HOME/.osb/benchmarks/data/<corpus>/<file>)
    gcs_cache_files:
      - corpus_size: "5m"
        gcs_path: "gs://opensearch-benchmark-datasets/cohere-wiki-en-768/cohere-5m.hdf5"
        target_path: "/datasets/opensearch-benchmark/.osb/benchmarks/data/cohere-5m/cohere-5m.hdf5"

    # Common parameters shared across all scenarios
    common_params:
      target_index_name: "cohere-wiki-en-768-{{corpus_size}}"
      target_field_name: "target_field"
      id_field_name: "_id"
      corpus_name: "cohere-{{corpus_size}}"
    
    # Engine-specific parameters (override or extend common_params)
    # These are used across multiple scenarios for this engine
    engine_params:
      faiss:
        engine: "faiss"
      
      lucene:
        engine: "lucene"
      
      jvector:
        engine: "jvector"
    
    # Test procedures with their base parameters
    test_procedures:
      - name: "delete-index"
        params: {}

      - name: "create-index"
        params:
          target_index_body: "indices/index.json"
          target_index_primary_shards: 3
          target_index_replica_shards: 1
          target_index_dimension: 768
          target_index_space_type: "innerproduct"
          hnsw_ef_construction: 256
          hnsw_m: 32
          refresh_interval: "-1"
          max_merged_segment: "2gb"
        # Engine-specific parameters for index creation
        engine_params:
          faiss:
            method_name: "hnsw"
          lucene:
            method_name: "hnsw"
          jvector:
            method_name: "disk_ann"
            mode: "on_disk"
      
        # uses bulk-vector-data-set which internally loads HDF5 corpus file — capped at corpus size (max 10m)
      - name: "bulk-ingest-data"
        params:
          target_index_bulk_size: 500
          target_index_bulk_index_data_set_format: "hdf5"
          target_index_bulk_index_data_set_corpus: "{{corpus_name}}"
          target_index_bulk_indexing_clients: 8
          detailed_results: false
        # DiskANN builds on-disk graphs during segment merges, which blocks Netty
        # threads for minutes at a time under concurrent write pressure.
        # Use a single client with large batches so each graph-build completes
        # before the next batch lands — prevents 99th-pct latency spikes and
        # partial-ingest shortfalls.
        engine_params:
          jvector:
            target_index_bulk_size: 2000
            target_index_bulk_indexing_clients: 1

        # uses make_blobs synthetic generation — no corpus file, supports any num_vectors
      - name: "bulk-ingest-random"
        params:
          target_index_bulk_size: 500
          target_index_bulk_indexing_clients: 8
          # num_vectors and target_index_dimension must be passed at runtime

      - name: "refresh-index"
        params: {}

      - name: "update-index-settings"
        params: {}

      - name: "force-merge"
        params:
          target_index_max_num_segments: 1
      
      - name: "vector-search"
        params:
          # reads queries and ground truth from HDF5 corpus file — capped at corpus size (max 10m)
          query_data_set_format: "hdf5"
          query_data_set_corpus: "{{corpus_name}}"
          neighbors_data_set_format: "hdf5"
          neighbors_data_set_corpus: "{{corpus_name}}"
          query_body:
            docvalue_fields: ["_id"]
            stored_fields: "_none_"
            _source: false
          number_of_repetitions: 1000
          warmup_time_period: 60
          time_period: 300
          hnsw_ef_search: 128
          search_clients: 8

        # synthetic make_blobs queries — no corpus file or ground truth, supports any scale
      - name: "vector-search-random"
        params:
          query_body:
            docvalue_fields: ["_id"]
            stored_fields: "_none_"
            _source: false
          warmup_time_period: 60
          time_period: 300
          hnsw_ef_search: 128
          # query_k and target_index_dimension should be passed at runtime
        
  cohere-msmarco-1024:
    dimension: 1024
    format: fvec
    space_type: "cosinesimil"
    description: "MS MARCO passage ranking dataset with 1024-dimensional vectors - configurable corpus size"
    workload: "msmarco" # needs to match opensearch-benchmark-workloads folder
    data_dir: "/datasets/msmarco"
    
    # Supported corpus sizes (ground truth files available for k=100)
    # All sizes from 2m to 125m are supported
    supported_corpus_sizes: [
      "1m", "2m", "4m", "5m", "8m", "10m", "15m", "16m", "20m", "25m", "30m", "32m",
      "40m", "45m", "50m", "55m", "60m", "64m", "65m", "70m", "75m", "80m", "85m",
      "90m", "100m", "125m", "128m"
    ]
    
    # Supported k values for ground truth (i.e. files that actually exist on S3)
    supported_k_values: [10, 100]
    
    # Common parameters shared across all scenarios
    common_params:
      target_index_name: "cohere-msmarco-1024-{{corpus_size}}"
    
    # Engine-specific parameters (used across scenarios)
    engine_params:
      jvector:
        engine: "jvector"
      faiss:
        engine: "faiss"
      lucene:
        engine: "lucene"

    # Base URL for all msmarco data files
    base_url: "https://jvector-datasets-infratest.s3.us-east-2.amazonaws.com/6174752eb60168112f2edb38493782da2ebe5ae6bfc870e25ed1711205e5395d_private/cohere/cohere_msmarco"
    
    data_files:
      - name: "cohere_msmarco_base.fvec"
        url: "{{base_url}}/cohere_msmarco_base.fvec"
        # Range automatically calculated based on corpus_size and dimension
      - name: "cohere_msmarco_queries.fvec"
        url: "{{base_url}}/cohere_msmarco_queries.fvec"
    # Test procedures for msmarco
    test_procedures:
      - name: "delete-index"
        params: {}

      - name: "create-index"
        params:
          target_index_body: "indices/index.json"
          target_index_primary_shards: 3
          target_index_replica_shards: 1
          target_index_dimension: 1024
          target_field_name: "vector"
          target_index_space_type: "cosinesimil"
          hnsw_ef_construction: 256
          hnsw_m: 32
          refresh_interval: "-1"
          max_merged_segment: "2gb"
        engine_params:
          jvector:
            method_name: "disk_ann"
            mode: "on_disk"
          faiss:
            method_name: "hnsw"
          lucene:
            method_name: "hnsw"

      - name: "bulk-ingest-data"
        params:
          target_index_bulk_size: 500
          target_index_bulk_index_data_set_path: "/datasets/msmarco/cohere_msmarco_base.fvec"
          target_index_bulk_indexing_clients: 8
          detailed_results: false
        # Same DiskANN constraint as cohere-wiki-en-768 — single client, large batches.
        engine_params:
          jvector:
            target_index_bulk_size: 2000
            target_index_bulk_indexing_clients: 1

      - name: "refresh-index"
        params: {}

      # Restores replicas to 1 after a no-replicas ingest, then waits for replica
      # allocation to complete. Used as step 5 in the sweep pipeline.
      # Requires an "enable-replicas" test procedure in workload.json (workload repo).
      - name: "enable-replicas"
        params:
          target_index_replica_shards: 1

      - name: "force-merge"
        params:
          target_index_max_num_segments: 1
      
      - name: "vector-search"
        params:
          queries_file: "/datasets/msmarco/cohere_msmarco_queries.fvec"
          ground_truth_file: "/datasets/msmarco/cohere_msmarco_indices_d1024_k{{query_k}}_{{corpus_size}}.ivec"
          target_field_name: "vector"
          query_body:
            docvalue_fields: ["_id"]
            stored_fields: "_none_"
            _source: false
          warmup_time_period: 60
          time_period: 300
          hnsw_ef_search: 128
          search_clients: 8

  cohere-wiki-parquet:
    dimension: 1024
    format: parquet
    space_type: "cosinesimil"
    description: "Cohere Wikipedia multilingual-v3 embeddings streamed from HuggingFace parquet files — ground truth computed on-the-fly by workload.py"
    workload: "parquet"

    supported_corpus_sizes: ["50k", "500k", "1m", "5m"]

    # No gcs_cache_files — data is streamed from HuggingFace at runtime.

    common_params:
      target_index_name: "cohere-wikipedia-parquet-{{corpus_size}}"

    engine_params:
      faiss:
        engine: "faiss"
      lucene:
        engine: "lucene"
      jvector:
        engine: "jvector"

    test_procedures:
      - name: "delete-index"
        params: {}

      - name: "create-index"
        params:
          target_index_body: "indices/index.json"
          target_index_primary_shards: 1
          target_index_replica_shards: 0
          target_index_dimension: 1024
          target_index_space_type: "cosinesimil"
          hnsw_ef_construction: 256
          hnsw_m: 16
          refresh_interval: "-1"
          max_merged_segment: "2gb"
        engine_params:
          faiss:
            method_name: "hnsw"
          lucene:
            method_name: "hnsw"
          jvector:
            method_name: "disk_ann"
            mode: "on_disk"

      - name: "bulk-ingest-data"
        params:
          target_index_bulk_size: 1000
          target_index_bulk_indexing_clients: 1
          num_queries: 1000
          detailed_results: false

      - name: "refresh-index"
        params: {}

      - name: "update-index-settings"
        params: {}

      - name: "force-merge"
        params:
          target_index_max_num_segments: 1

      - name: "vector-search"
        params:
          # Ground truth file is computed during bulk-ingest-data and keyed by num_vectors.
          # workload.json derives both target_index_name and queries_file from num_vectors
          # automatically — no need to set them here unless overriding.
          warmup_time_period: 60
          time_period: 300
          hnsw_ef_search: 128
          query_k: 10
          search_clients: 1
          detailed_results: true

      - name: "create-search-pipeline"
        params:
          search_pipeline: "hybrid-search-pipeline"
          normalization_technique: "min_max"
          bm25_weight: 0.3
          knn_weight: 0.7

      - name: "delete-search-pipeline"
        params:
          search_pipeline: "hybrid-search-pipeline"

      - name: "hybrid-search"
        params:
          warmup_time_period: 60
          time_period: 300
          hnsw_ef_search: 128
          query_k: 10
          search_clients: 1
          search_pipeline: "hybrid-search-pipeline"
          hybrid_text_field: "text"
          detailed_results: true

  dbpedia-openai-1536:
    dimension: 1536
    format: parquet
    space_type: "cosinesimil"
    description: "DBpedia entities with 1536-dimensional OpenAI embeddings streamed from HuggingFace parquet files — ground truth computed on-the-fly by workload.py"
    workload: "parquet"

    supported_corpus_sizes: ["50k", "500k", "1m"]

    # Data is streamed directly from HuggingFace at runtime.
    common_params:
      target_index_name: "dbpedia-openai-1536-{{corpus_size}}"
      target_index_dimension: 1536
      target_field_name: "openai"
      hf_repo_id: "KShivendu/dbpedia-entities-openai-1M"
      hf_dataset_dir: "datasets/KShivendu/dbpedia-entities-openai-1M/data"

    engine_params:
      faiss:
        engine: "faiss"
      lucene:
        engine: "lucene"
      jvector:
        engine: "jvector"

    test_procedures:
      - name: "delete-index"
        params: {}

      - name: "create-index"
        params:
          target_index_body: "indices/index.json"
          target_index_primary_shards: 1
          target_index_replica_shards: 0
          target_index_space_type: "cosinesimil"
          hnsw_ef_construction: 256
          hnsw_m: 16
          refresh_interval: "-1"
        engine_params:
          faiss:
            method_name: "hnsw"
          lucene:
            method_name: "hnsw"
          jvector:
            method_name: "disk_ann"
            mode: "on_disk"

      - name: "bulk-ingest-data"
        params:
          target_index_bulk_size: 1000
          target_index_bulk_indexing_clients: 1
          num_queries: 1000
          detailed_results: false

      - name: "refresh-index"
        params: {}

      - name: "force-merge"
        params:
          target_index_max_num_segments: 1

      - name: "vector-search"
        params:
          warmup_time_period: 60
          time_period: 300
          hnsw_ef_search: 128
          query_k: 10
          search_clients: 1
          detailed_results: true

      - name: "create-search-pipeline"
        params:
          search_pipeline: "hybrid-search-pipeline"
          normalization_technique: "min_max"
          bm25_weight: 0.3
          knn_weight: 0.7

      - name: "delete-search-pipeline"
        params:
          search_pipeline: "hybrid-search-pipeline"

      - name: "hybrid-search"
        params:
          warmup_time_period: 60
          time_period: 300
          hnsw_ef_search: 128
          query_k: 10
          search_clients: 1
          search_pipeline: "hybrid-search-pipeline"
          hybrid_text_field: "text"
          detailed_results: true

