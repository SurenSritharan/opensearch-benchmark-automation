apiVersion: v1
kind: Service
metadata:
  name: benchmark-api
  labels:
    app: opensearch-benchmark
    component: api-server
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: opensearch-benchmark
    component: api-server
---
# PVCs removed - they already exist from other manifests
# Using existing PVCs to preserve data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch-benchmark-api-server
  labels:
    app: opensearch-benchmark
    component: api-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opensearch-benchmark
      component: api-server
  template:
    metadata:
      labels:
        app: opensearch-benchmark
        component: api-server
    spec:
      nodeSelector:
        cloud.google.com/gke-nodepool: client-pool
      
      containers:
      - name: api-server
        image: python:3.11-slim
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -e
            echo "Installing dependencies..."
            apt-get update -y -qq
            apt-get install -y -qq git curl wget vim gcc python3-dev jq tini
            
            echo "Installing Python packages..."
            pip install --quiet flask flask-cors pyyaml gunicorn filelock
            
            echo "Setting up directories..."
            mkdir -p /results /app/web
            
            echo "Setting up workspace..."
            if [ ! -d "/workspace/.git" ]; then
              echo "Cloning benchmark automation project (first time)..."
              git clone --depth 1 https://github.com/SurenSritharan/opensearch-benchmark-automation.git /workspace-tmp
              mv /workspace-tmp/* /workspace/
              mv /workspace-tmp/.git /workspace/
              rm -rf /workspace-tmp
            else
              echo "Workspace already exists, pulling latest changes..."
              cd /workspace
              git pull origin main || echo "Git pull failed, using existing version"
            fi
            
            echo "Setting up API service..."
            cp /workspace/cloud-service/*.py /app/
            cp -r /workspace/cloud-service/web /app/
            
            if [ -f "/workspace/cloud-service/requirements.txt" ]; then
              echo "Installing cloud-service requirements..."
              pip install --quiet -r /workspace/cloud-service/requirements.txt
            fi
            
            echo "Starting API server (no benchmark execution)..."
            cd /app
            # Run API server only - no job processing
            exec /usr/bin/tini -- gunicorn --bind 0.0.0.0:8080 --workers 2 --threads 4 --timeout 300 --access-logfile - app:app
        
        env:
        - name: WORKER_ENGINES
          value: "none"  # API server only - don't process any jobs
        - name: WORKER_MODE
          value: "api-only"
        - name: PYTHONUNBUFFERED
          value: "1"
        
        resources:
          requests:
            memory: "4Gi"
            cpu: "2"
          limits:
            memory: "8Gi"
            cpu: "4"
        
        volumeMounts:
        - name: results
          mountPath: /results
        - name: workspace
          mountPath: /workspace
        
        ports:
        - containerPort: 8080
          name: http
        
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 30
        
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
      
      volumes:
      - name: results
        persistentVolumeClaim:
          claimName: benchmark-results-storage
      - name: workspace
        persistentVolumeClaim:
          claimName: benchmark-workspace-storage

