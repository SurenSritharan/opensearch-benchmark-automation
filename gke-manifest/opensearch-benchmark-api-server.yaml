apiVersion: v1
kind: Service
metadata:
  name: benchmark-api
  namespace: ${NAMESPACE}
  labels:
    app: opensearch-benchmark
    component: api-server
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: opensearch-benchmark
    component: api-server
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: benchmark-api-db-storage
  namespace: ${NAMESPACE}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
  storageClassName: premium-rwo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch-benchmark-api-server
  namespace: ${NAMESPACE}
  labels:
    app: opensearch-benchmark
    component: api-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opensearch-benchmark
      component: api-server
  template:
    metadata:
      labels:
        app: opensearch-benchmark
        component: api-server
    spec:
      nodeSelector:
        cloud.google.com/gke-nodepool: client-pool
      
      containers:
      - name: api-server
        image: python:3.11-slim
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -e
            echo "Installing dependencies..."
            apt-get update -y -qq
            apt-get install -y -qq git curl wget vim gcc python3-dev jq tini
            
            echo "Installing Python packages..."
            pip install --quiet flask flask-cors jinja2 pyyaml gunicorn filelock
            
            echo "Setting up directories..."
            mkdir -p /app/web

            echo "Cloning benchmark automation project..."
            git clone --depth 1 https://github.com/SurenSritharan/opensearch-benchmark-automation.git /workspace-tmp
            cp /workspace-tmp/cloud-service/*.py /app/
            cp -r /workspace-tmp/cloud-service/web /app/
            cp /workspace-tmp/cloud-service/requirements.txt /app/ 2>/dev/null || true
            cp -r /workspace-tmp/config /app/config
            rm -rf /workspace-tmp
            
            if [ -f "/app/requirements.txt" ]; then
              echo "Installing cloud-service requirements..."
              pip install --quiet -r /app/requirements.txt
            fi
            
            echo "Starting API server..."
            cd /app
            exec /usr/bin/tini -- gunicorn --bind 0.0.0.0:8080 --workers 2 --threads 4 --timeout 300 --access-logfile - app:app
        
        env:
        - name: WORKER_ENGINES
          value: "none"  # API server only - don't process any jobs
        - name: WORKER_MODE
          value: "api-only"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: WORKSPACE_DIR
          value: "/app"
        - name: RESULTS_DIR
          value: "/data/results"
        - name: WORKER_URL_TEMPLATE
          value: "http://opensearch-benchmark-worker-{engine}-0.opensearch-benchmark-worker-{engine}.${NAMESPACE}.svc.cluster.local:8080"
        
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"

        ports:
        - containerPort: 8080
          name: http
        
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          failureThreshold: 40
          periodSeconds: 15

        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 30
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 10
          failureThreshold: 3
      
