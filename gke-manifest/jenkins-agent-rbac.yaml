# ServiceAccount and RBAC for the Jenkins pipeline.
# The jenkins SA in benchmark-api is used to generate a kubeconfig Secret
# (gke-kubeconfig) stored in Jenkins credentials. The pipeline uses this
# kubeconfig to run kubectl commands against GKE from the Jenkins server.
#
# Apply with:
#   kubectl apply -f gke-manifest/jenkins-agent-rbac.yaml

apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins
  namespace: benchmark-api
---
# benchmark-api namespace — scale workers, read pods, manage deployments
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-agent
  namespace: benchmark-api
subjects:
- kind: ServiceAccount
  name: jenkins
  namespace: benchmark-api
roleRef:
  kind: ClusterRole
  name: edit
  apiGroup: rbac.authorization.k8s.io
---
# os-jvector namespace — scale statefulsets, read pods/events
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-agent
  namespace: os-jvector
subjects:
- kind: ServiceAccount
  name: jenkins
  namespace: benchmark-api
roleRef:
  kind: ClusterRole
  name: edit
  apiGroup: rbac.authorization.k8s.io
---
# os-faiss namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-agent
  namespace: os-faiss
subjects:
- kind: ServiceAccount
  name: jenkins
  namespace: benchmark-api
roleRef:
  kind: ClusterRole
  name: edit
  apiGroup: rbac.authorization.k8s.io
---
# os-lucene namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-agent
  namespace: os-lucene
subjects:
- kind: ServiceAccount
  name: jenkins
  namespace: benchmark-api
roleRef:
  kind: ClusterRole
  name: edit
  apiGroup: rbac.authorization.k8s.io
---
roleRef:
  kind: ClusterRole
  name: edit
  apiGroup: rbac.authorization.k8s.io

